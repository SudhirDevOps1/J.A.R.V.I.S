[pytest]
# Keep the default run focused and fast. CI additionally passes
# `-m "not network"`, but declaring it here means a plain `pytest` also skips
# the live-API tests unless explicitly requested.
testpaths = tests
addopts = -ra --strict-markers
markers =
    network: tests that call live third-party APIs (Open-Meteo, Amazon/Flipkart,
        Google Flights). Non-deterministic by nature; excluded from CI so the
        gate reflects this codebase rather than upstream rate limits or markup
        changes. Run them locally with: pytest -m network
    slow: tests that legitimately take more than a few seconds
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:starlette.*