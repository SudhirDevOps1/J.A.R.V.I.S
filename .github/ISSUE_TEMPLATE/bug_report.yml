name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please read [SECURITY.md](../SECURITY.md) first —
        if this is a vulnerability rather than a bug, do not file it here.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. I said "..."
        2. I expected ...
        3. Instead it ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        From `logs/jarvis_runtime.log`, around the time it happened.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.2.3 or abc1234
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.12.1

  - type: dropdown
    id: provider
    attributes:
      label: Which provider were you using?
      options:
        - Gemini (cloud)
        - Local LLM (Ollama / LM Studio / vLLM)
        - Edge reflex only (offline)
        - Not applicable

  - type: textarea
    id: api-keys
    attributes:
      label: API keys and personal data
      description: |
        Please check this before submitting. Remove anything that is a real
        credential, a file path containing your username, or someone's name.
      value: |
        I have removed API keys and personal data from everything above.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this.
          required: true
        - label: This is not a security issue (see SECURITY.md).
          required: true