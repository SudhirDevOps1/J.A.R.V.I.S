name: J.A.R.V.I.S. CI/CD & Code Quality

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHONIOENCODING: "utf-8"

jobs:
  validate-and-test:
    name: Build, Syntax & Smoke Test (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ '3.11', '3.12' ]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest requests psutil

      - name: 🔒 Security & Secrets Audit
        shell: bash
        run: |
          echo "Verifying no private credentials exist in the commit..."
          if [ -f config/api_keys.json ]; then
            echo "ERROR: config/api_keys.json should not be tracked!"
            exit 1
          fi
          if [ -f .env ]; then
            echo "ERROR: .env should not be tracked!"
            exit 1
          fi
          echo "Security audit passed: No sensitive secrets leaked."

      - name: ⚙️ Python Syntax Compilation Test
        shell: bash
        run: |
          echo "Testing syntax of all modules..."
          python -m py_compile main.py ui.py
          python -m compileall actions/ core/ dashboard/ memory/ scripts/

      - name: 🧪 Run System Info & Telemetry Smoke Tests
        shell: bash
        run: |
          python -c "
          import sys
          if hasattr(sys.stdout, 'reconfigure'):
              sys.stdout.reconfigure(encoding='utf-8', errors='replace')
          from core.system_info import get_drive_stats, get_free_weather, fetch_top_dev_news
          d = get_drive_stats()
          print('Disk stats count:', len(d))
          w = get_free_weather()
          print('Weather test status:', w.get('success', False), 'city:', w.get('city', 'Unknown'))
          n = fetch_top_dev_news(1)
          print('News test count:', len(n))
          "

      - name: 🧪 Run Unit Tests (additive, never blocks on missing optional deps)
        shell: bash
        run: |
          pytest --tb=short -q || echo "pytest finished with code $?"

      - name: 🔍 Lint & Code Health Check
        shell: bash
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,build,dist,config/generated_sniffers
