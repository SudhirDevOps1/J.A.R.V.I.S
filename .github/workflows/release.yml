name: Release & Publish J.A.R.V.I.S.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'
      force:
        description: 'Force release even if 20-commit threshold is not reached'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Package & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🏷️ Verify Release Readiness (20-Commit Threshold Rule)
        shell: bash
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python scripts/check_release_readiness.py --force
          else
            python scripts/check_release_readiness.py --check
          fi

      - name: 📦 Install Packaging Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psutil zipfile36 || true

      - name: 🔒 Security & Credential Audit
        shell: bash
        run: |
          echo "Scanning for accidental secrets before release packaging..."
          if [ -f config/api_keys.json ]; then
            echo "CRITICAL: config/api_keys.json found! Aborting release build."
            exit 1
          fi
          if [ -f .env ]; then
            echo "CRITICAL: .env file found! Aborting release build."
            exit 1
          fi
          echo "Security audit passed: Clean repository."

      - name: ⚙️ Python Syntax Compilation Validation
        shell: bash
        run: |
          echo "Validating syntax across all modules..."
          python -m py_compile main.py ui.py setup.py
          python -m compileall actions/ core/ dashboard/ memory/ scripts/

      - name: 📦 Package Release Distribution
        shell: bash
        run: |
          VERSION_TAG="${{ inputs.version }}"
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="v0.1.0"
          fi
          echo "Packaging distribution for ${VERSION_TAG}..."
          mkdir -p dist

          # Create a clean release zip excluding git internals, pycache, temporary files
          zip -r "dist/JARVIS-${VERSION_TAG}.zip" . \
            -x "*.git*" \
            -x "*__pycache__*" \
            -x "*.pytest_cache*" \
            -x "*.venv*" \
            -x "*dist/*" \
            -x "*build/*" \
            -x "*.tmp*" \
            -x "*.log" \
            -x "config/api_keys.json" \
            -x ".env*"

          cd dist
          sha256sum "JARVIS-${VERSION_TAG}.zip" > checksums-sha256.txt
          echo "Checksum generated:"
          cat checksums-sha256.txt
          cd ..

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: "J.A.R.V.I.S. Release ${{ github.ref_name }}"
          files: |
            dist/JARVIS-*.zip
            dist/checksums-sha256.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
