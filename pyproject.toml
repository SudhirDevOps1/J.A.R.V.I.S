[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
# Not a literal. core/version.py is the single source of truth, because that is
# what Release Please bumps. A hardcoded copy here silently desynchronised the
# moment a release landed: the repo said 0.2.0 and the package said 1.4.0.
dynamic = ["version"]
description = "A private, local-first voice AI assistant that controls your own PC."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
keywords = ["assistant", "voice", "automation", "local-first", "offline", "pyqt6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: English",
    "Natural Language :: Hindi",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

# Deliberately empty.
#
# The real dependency set lives in requirements.txt and carries
# `sys_platform` markers so a Linux user never pulls Windows-only wheels and
# vice versa. setuptools cannot express those markers in [project].dependencies
# without duplicating the file and letting the two drift apart, which is how
# platforms end up installing things that do not exist for them.
#
# To install the dependencies for this machine:
#     pip install -r requirements.txt
# or run the bootstrap, which does it for your OS:
#     python setup.py
dependencies = []

[project.urls]
Homepage = "https://github.com/SudhirDevOps1/J.A.R.V.I.S"
Source = "https://github.com/SudhirDevOps1/J.A.R.V.I.S"
Issues = "https://github.com/SudhirDevOps1/J.A.R.V.I.S/issues"

# The version is read from core/version.py, which is what Release Please bumps.
# `attr` is resolved statically from the module source when possible, so
# building the package does not require PyQt6 - or anything else in the runtime
# dependency set - to be importable.
[tool.setuptools.dynamic]
version = { attr = "core.version.__version__" }

[project.scripts]
jarvis = "main:main"

[tool.setuptools]
# Explicit list rather than automatic discovery. Discovery would either grab
# `tests`, `dashboard` and `logs` or fail outright on the flat layout, and
# either way the answer changes as directories are added.
#
# Only directories that actually contain an __init__.py are listed. `actions`
# and `scripts` are namespace-style directories of standalone modules loaded
# by path (core/action_loader.py and the git-hook installer respectively), so
# declaring them as packages would claim a __init__.py that is not there.
packages = ["core", "dashboard", "memory", "plugins", "ui"]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.package-data]
"*" = [
    "config/*.json",
    "config/*.example.json",
    "core/assets/**/*",
    "dashboard/static/*",
    "plugins/*.json",
]

# ── shared tool configuration ───────────────────────────────────────────────
#
# There is no enforced formatter in this project, so these are the only place
# a shared style is written down besides .editorconfig. Both are set to a
# baseline that reflects the code as it actually is, not an aspiration: adding
# stricter settings here and shipping them would produce thousands of errors on
# first run and train people to ignore the tool.
#
# CI gates on `--select=E9,F63,F7,F82`, which is the subset that catches real
# breakage (syntax errors, undefined names) rather than style opinions.

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__", "build", "dist", "logs", "dashboard/static"]

[tool.ruff.lint]
# Matches what CI enforces today. Widen deliberately and with a reason.
select = ["E9", "F63", "F7", "F82"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# The bootstrap and the tiny tool scripts legitimately reach for broad
# exception handling; they are wrappers around OS calls.
"setup.py" = ["E722"]
"scripts/*" = ["E722"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
# Not enabled yet, and deliberately so: turning on strict checking across ~190
# files with no annotations produces noise, not signal. Enable per-module as
# files gain annotations.
check_untyped_defs = false
disallow_untyped_defs = false
exclude = "(.venv|build|dist|logs)/"